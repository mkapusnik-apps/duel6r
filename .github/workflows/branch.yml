name: Feature - Sanity check

on:
  pull_request:
    branches: [ 'develop' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (Linux)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull build image
        run: docker pull ghcr.io/${{ github.repository }}/build:develop

      - name: Build inside container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            ghcr.io/${{ github.repository }}/build:develop

      - name: Verify build output
        run: test -x build/duel6r
