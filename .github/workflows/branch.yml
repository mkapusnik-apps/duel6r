name: Feature - Compile

on:
  pull_request:
    branches: ['develop']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build inside container
        run: |
          docker run --rm --pull always \
            -e BUILD_TESTING=OFF \
            -v "$PWD:/workspace" \
            ghcr.io/${{ github.repository }}/build:develop
