name: Feature - Sanity check

on:
  pull_request:
    branches: [ 'develop' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (Linux)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull build image
        run: docker pull ghcr.io/${{ github.repository }}/build:develop

      - name: Build inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            ghcr.io/${{ github.repository }}/build:develop

      - name: Upload CTest diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ctest-diagnostics
          path: build/ci-diagnostics/
          if-no-files-found: ignore

      - name: Verify build output
        run: test -x build/duel6r
