name: Feature - Sanity check

on:
  pull_request:
    branches: [ 'develop' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (Linux)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull build image
        run: docker pull ghcr.io/${{ github.repository }}/build:develop

      - name: Build inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            ghcr.io/${{ github.repository }}/build:develop

      - name: Upload CTest diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ctest-diagnostics
          path: build/ci-diagnostics/
          if-no-files-found: ignore

      - name: Verify build output
        run: test -x build/duel6r


  native-windows-transport:
    name: MSVC x64 transport CTests
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Start Docker service
        shell: powershell
        run: Start-Service docker

      - name: Build native Windows tool image
        shell: powershell
        run: |
          docker build `
            --file Dockerfile.windows-native-transport `
            --tag duel6r-windows-transport:ci `
            .

      - name: Build and test inside native Windows container
        shell: powershell
        run: .\docker\run-windows-native-transport.ps1

  ready:
    name: Feature Ready
    needs: [compile, native-windows-transport]
    runs-on: self-hosted
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
