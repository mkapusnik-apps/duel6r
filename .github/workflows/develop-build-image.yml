name: Develop - Build Container Image

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-build-images-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-image-linux:
    name: Publish Linux Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta-linux
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/build
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Linux build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta-linux.outputs.tags }}
          labels: ${{ steps.meta-linux.outputs.labels }}

  build-image-windows:
    name: Publish Windows Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata (Windows cross)
        id: meta-win
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/build-w64
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Windows cross image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.windows-cross
          push: true
          tags: ${{ steps.meta-win.outputs.tags }}
          labels: ${{ steps.meta-win.outputs.labels }}
