name: Develop - Build Container Image

on:
  push:
    branches: [develop]
    paths:
      - Dockerfile
      - Dockerfile.windows-cross
      - docker/build.sh
      - docker/main-menu-smoke.sh
      - docker/build-windows.sh
      - docker/validate-bundle.sh
      - docker/toolchains/mingw-w64-x86_64.cmake
      - .github/workflows/develop-build-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Publish ${{ matrix.name }} Build Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            dockerfile: Dockerfile
            image: build
          - name: Windows
            dockerfile: Dockerfile.windows-cross
            image: build-w64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
