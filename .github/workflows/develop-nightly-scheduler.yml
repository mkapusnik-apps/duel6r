name: Develop - Nightly Scheduler
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scheduler:
    name: Scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch nightly build from the sanity tag
        run: gh workflow run develop-nightly.yml --ref sanity --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Disable scheduler until the next successful develop build
        run: gh workflow disable develop-nightly-scheduler.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.PAT }}
