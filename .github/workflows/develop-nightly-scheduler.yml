name: Develop - Nightly Scheduler
on:
  schedule:
    - cron: "10 */4 * * *"
#    - cron: "0 4,20 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scheduler:
    name: Activate Scheduler
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_ACTIONS }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow disable "${{ github.workflow }}"
      - run: gh workflow run develop-nightly.yml --ref sanity
