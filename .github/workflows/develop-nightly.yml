name: Develop - Nightly

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Nightly Build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull Linux build image
        run: docker pull ghcr.io/${{ github.repository }}/build:develop

      - name: Pull Windows cross build image
        run: docker pull ghcr.io/${{ github.repository }}/build-w64:develop

      - name: Build Linux nightly files inside shared bundle
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            -e CLEAN_OUTPUT_DIR=ON \
            ghcr.io/${{ github.repository }}/build:develop

      - name: Build Windows nightly files inside shared bundle
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=OFF \
            ghcr.io/${{ github.repository }}/build-w64:develop

      - name: Package nightly bundle
        working-directory: build
        run: zip -r ../duel6r-nightly.zip .

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-release-asset
          path: duel6r-nightly.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish nightly pre-release
    needs: [build]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download nightly artifact
        uses: actions/download-artifact@v8
        with:
          name: nightly-release-asset
          path: release-assets

      - name: Move nightly tag
        uses: mkapusnik-apps/commons/git-ref@v1
        with:
          ref: refs/tags/nightly
          commit_sha: ${{ github.sha }}
          token: ${{ secrets.PAT_ACTIONS }}
          create_if_missing: 'false'

      - name: Update nightly pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          files: release-assets/duel6r-nightly.zip
          overwrite_files: true
          fail_on_unmatched_files: true

  tag:
    name: Tag - nightly
    permissions:
      contents: 'write'
    runs-on: ubuntu-latest
    needs: [ release ]
    steps:
      - uses: actions/checkout@v7

      - uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: nightly
          token: ${{ secrets.PAT_ACTIONS }}
