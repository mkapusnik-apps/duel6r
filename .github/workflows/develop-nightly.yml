name: Develop - Nightly
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Nightly Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Linux nightly files inside shared bundle
        run: |
          docker run --rm --pull always \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            -e CLEAN_OUTPUT_DIR=ON \
            -v "$PWD:/workspace" \
            ghcr.io/${{ github.repository }}/build:develop

      - name: Build Windows nightly files inside shared bundle
        run: |
          docker run --rm --pull always \
            -e BUILD_TESTING=OFF \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=OFF \
            -v "$PWD:/workspace" \
            ghcr.io/${{ github.repository }}/build-w64:develop

      - name: Package nightly bundle
        id: package
        run: |
          archive_name="duel6r-nightly.zip"
          bash docker/validate-bundle.sh all build
          python3 -m zipfile -c "$archive_name" build
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

  release:
    name: Publish nightly pre-release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download nightly artifact
        uses: actions/download-artifact@v8
        with:
          name: duel6r-nightly.zip
          path: release-assets

      - name: Confirm the canonical nightly pre-release exists
        run: |
          test "$(gh release view nightly --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)" = "true"
          gh api "repos/${{ github.repository }}/git/ref/tags/nightly" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          prerelease: true
          files: release-assets/duel6r-nightly.zip
          fail_on_unmatched_files: true

  tag:
    name: Tag - nightly
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move nightly tag to the published commit
        uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: nightly
          token: ${{ secrets.PAT }}
