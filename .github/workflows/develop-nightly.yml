name: Develop - Nightly

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  source:
    name: Capture sanity source
    runs-on: ubuntu-latest
    outputs:
      sanity_sha: ${{ steps.capture.outputs.sanity_sha }}
    steps:
      - name: Require the sanity tag invocation
        id: capture
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/tags/sanity" ]]; then
            echo "::error::Develop - Nightly must be dispatched from refs/tags/sanity; received ${GITHUB_REF}."
            exit 1
          fi
          echo "sanity_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  build:
    name: Nightly Build
    needs: [source]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sanity_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull exact Linux build image
        env:
          BUILD_IMAGE: ghcr.io/${{ github.repository }}/build:sha-${{ needs.source.outputs.sanity_sha }}
        run: |
          docker pull "${BUILD_IMAGE}" || {
            echo "::error::The Linux build image for sanity SHA ${{ needs.source.outputs.sanity_sha }} is unavailable."
            exit 1
          }

      - name: Pull exact Windows cross build image
        env:
          BUILD_IMAGE: ghcr.io/${{ github.repository }}/build-w64:sha-${{ needs.source.outputs.sanity_sha }}
        run: |
          docker pull "${BUILD_IMAGE}" || {
            echo "::error::The Windows build image for sanity SHA ${{ needs.source.outputs.sanity_sha }} is unavailable."
            exit 1
          }

      - name: Build Linux nightly files inside shared bundle
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e D6R_DIRECTORY_DEFAULT_URL=https://staging.duel.netusite.cz \
            -e BUILD_TESTING=OFF \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=ON \
            ghcr.io/${{ github.repository }}/build:sha-${{ needs.source.outputs.sanity_sha }}

      - name: Build Windows nightly files inside shared bundle
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e D6R_DIRECTORY_DEFAULT_URL=https://staging.duel.netusite.cz \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=OFF \
            ghcr.io/${{ github.repository }}/build-w64:sha-${{ needs.source.outputs.sanity_sha }}

      - name: Package nightly bundle
        working-directory: build
        run: zip -r ../duel6r-nightly.zip .

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-release-asset
          path: duel6r-nightly.zip
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS nightly package
    needs: [source]
    permissions:
      contents: read
    uses: ./.github/workflows/macos-build.yml
    with:
      source_sha: ${{ needs.source.outputs.sanity_sha }}
      retention_days: 1

  release:
    name: Publish nightly release
    needs: [source, build, macos]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download nightly artifact
        uses: actions/download-artifact@v8
        with:
          name: nightly-release-asset
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-release-asset
          path: release-assets/macos

      - name: Validate nightly artifact
        shell: bash
        run: |
          test -s release-assets/duel6r-nightly.zip
          unzip -t release-assets/duel6r-nightly.zip

      - name: Move nightly tag
        uses: mkapusnik-apps/commons/git-ref@v1
        with:
          ref: refs/tags/nightly
          commit_sha: ${{ needs.source.outputs.sanity_sha }}
          token: ${{ secrets.PAT_ACTIONS }}
          create_if_missing: 'false'

      - name: Delete existing nightly release without deleting the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --paginate --jq '.[] | select(.tag_name == "nightly") | .id')"
          if [[ -n "${release_id}" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi

      - name: Publish fresh nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: nightly
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release-assets/duel6r-nightly.zip
            release-assets/macos/duel6r-macos-arm64.zip
            release-assets/macos/duel6r-macos-arm64.zip.sha256
            release-assets/macos/build-info.json
          fail_on_unmatched_files: true

  directory:
    name: Deploy staging directory
    needs: [source, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: directory-deployment
      cancel-in-progress: false
      queue: max
    env:
      IMAGE: europe-west1-docker.pkg.dev/duel-6-reloaded/directory/directory
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sanity_sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: duel-6-reloaded
          workload_identity_provider: projects/987997960434/locations/global/workloadIdentityPools/d6r-directory/providers/nightly
          service_account: d6r-directory-staging-deploy@duel-6-reloaded.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build the nightly directory image once
        id: image
        uses: docker/build-push-action@v7
        with:
          context: services/directory
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:nightly-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ needs.source.outputs.sanity_sha }}

      - name: Deploy candidate without replacing serving traffic
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: duel-6-reloaded
          region: europe-west1
          service: staging-directory
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          suffix: gh-${{ github.run_id }}-${{ github.run_attempt }}
          tag: candidate
          no_traffic: true
          env_vars_update_strategy: overwrite
          env_vars: |
            NODE_ENV=production
            GOOGLE_CLOUD_PROJECT=duel-6-reloaded
            D6R_DIRECTORY_FIRESTORE_DATABASE=staging-directory
          flags: >-
            --service-account=d6r-directory-staging-runtime@duel-6-reloaded.iam.gserviceaccount.com
            --ingress=all --port=8080 --min=0 --max=2
            --min-instances=0 --max-instances=2 --concurrency=32
            --startup-probe=httpGet.path=/healthz,httpGet.port=8080,periodSeconds=10,timeoutSeconds=3,failureThreshold=3

      - name: Verify candidate and activate staging traffic
        env:
          REVISION: staging-directory-gh-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ needs.source.outputs.sanity_sha }}
        run: |
          candidate_url="$(gcloud run services describe staging-directory \
            --project=duel-6-reloaded --region=europe-west1 --format=json \
            | jq -er '.status.traffic[] | select(.tag == "candidate") | .url')"
          curl --fail --silent --show-error --max-time 30 "${candidate_url}/v1/listings" | jq -e '.listings | type == "array"'
          gcloud run services update-traffic staging-directory \
            --project=duel-6-reloaded --region=europe-west1 \
            --to-revisions="${REVISION}=100" --quiet
          service_url="https://staging.duel.netusite.cz"
          curl --fail --silent --show-error --max-time 30 "${service_url}/v1/listings" | jq -e '.listings | type == "array"'
          printf 'Source: %s\n\nImage: %s@%s\n\nRevision: %s\n\nEndpoint: %s\n' \
            "$SOURCE_SHA" "$IMAGE" "$DIGEST" "$REVISION" "$service_url" >> "$GITHUB_STEP_SUMMARY"

      # This is the promotion commit point. Failed or unverified candidates cannot advance it.
      - name: Record the successfully verified staging image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gcloud artifacts docker tags add "${IMAGE}@${DIGEST}" \
            "${IMAGE}:staging-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --project=duel-6-reloaded --quiet
          gcloud artifacts tags update staging-success \
            --package=directory --version="${DIGEST}" \
            --repository=directory --location=europe-west1 \
            --project=duel-6-reloaded --quiet
