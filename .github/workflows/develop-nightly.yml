name: Develop - Nightly

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  source:
    name: Capture sanity source
    runs-on: ubuntu-latest
    outputs:
      sanity_sha: ${{ steps.capture.outputs.sanity_sha }}
    steps:
      - name: Require the sanity tag invocation
        id: capture
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/tags/sanity" ]]; then
            echo "::error::Develop - Nightly must be dispatched from refs/tags/sanity; received ${GITHUB_REF}."
            exit 1
          fi
          echo "sanity_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  build:
    name: Nightly Build
    needs: [source]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sanity_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull exact Linux build image
        env:
          BUILD_IMAGE: ghcr.io/${{ github.repository }}/build:sha-${{ needs.source.outputs.sanity_sha }}
        run: |
          docker pull "${BUILD_IMAGE}" || {
            echo "::error::The Linux build image for sanity SHA ${{ needs.source.outputs.sanity_sha }} is unavailable."
            exit 1
          }

      - name: Pull exact Windows cross build image
        env:
          BUILD_IMAGE: ghcr.io/${{ github.repository }}/build-w64:sha-${{ needs.source.outputs.sanity_sha }}
        run: |
          docker pull "${BUILD_IMAGE}" || {
            echo "::error::The Windows build image for sanity SHA ${{ needs.source.outputs.sanity_sha }} is unavailable."
            exit 1
          }

      - name: Build Linux nightly files inside shared bundle
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=OFF \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=ON \
            ghcr.io/${{ github.repository }}/build:sha-${{ needs.source.outputs.sanity_sha }}

      - name: Build Windows nightly files inside shared bundle
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=OFF \
            ghcr.io/${{ github.repository }}/build-w64:sha-${{ needs.source.outputs.sanity_sha }}

      - name: Package nightly bundle
        working-directory: build
        run: zip -r ../duel6r-nightly.zip .

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-release-asset
          path: duel6r-nightly.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish nightly release
    needs: [source, build]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download nightly artifact
        uses: actions/download-artifact@v8
        with:
          name: nightly-release-asset
          path: release-assets

      - name: Move nightly tag
        uses: mkapusnik-apps/commons/git-ref@v1
        with:
          ref: refs/tags/nightly
          commit_sha: ${{ needs.source.outputs.sanity_sha }}
          token: ${{ secrets.PAT_ACTIONS }}
          create_if_missing: 'false'

      - name: Create or update nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: nightly
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: release-assets/duel6r-nightly.zip
          fail_on_unmatched_files: true
