name: Develop - Sanity
on:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Build checked-out Linux build image
        run: docker build -t duel6r-build:sanity .

      - name: Build runtime bundle inside container
        run: |
          docker run --rm \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            -v "$PWD:/workspace" \
            duel6r-build:sanity

      - name: Run main menu smoke test
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/duel6r-main-menu-smoke \
            -v "$PWD:/workspace" \
            duel6r-build:sanity

      - name: Upload main menu smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-menu-smoke
          path: build/smoke-main-menu/
          if-no-files-found: ignore

  lint:
    name: Lint-equivalent Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Build checked-out Linux build image
        run: docker build -t duel6r-build:lint .

      - name: Run lint-equivalent debug build inside container
        run: |
          docker run --rm \
            -e BUILD_TYPE=Debug \
            -e BUILD_TESTING=OFF \
            -v "$PWD:/workspace" \
            duel6r-build:lint

  tag:
    name: Tag - sanity
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [sanity, lint]
    steps:
      - name: Move sanity tag to the validated commit
        uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: sanity
          token: ${{ secrets.PAT }}

      - name: Enable the one-shot nightly scheduler
        run: gh workflow enable develop-nightly-scheduler.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.PAT }}
