name: Develop - Sanity

on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sanity:
    name: ${{ matrix.name }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit
            name: Unit / basic checks (Linux)
          - group: common
            name: Common / local game (Linux)
          - group: network
            name: Network / server-client (Linux)
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve source tool version (wait for independent publication)
        id: tools
        timeout-minutes: 125
        run: bash docker/resolve-tool-image.sh ghcr.io/${{ github.repository }}/build Dockerfile 7200 >> "$GITHUB_OUTPUT"

      - name: Build and run selected CTests inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            -e CTEST_LABEL_REGEX='^sanity-${{ matrix.group }}$' \
            ${{ steps.tools.outputs.image }}

      - name: Upload CTest diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ctest-diagnostics-sanity-${{ matrix.group }}
          path: build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify build output
        run: test -x build/duel6r

      - name: Unit / basic - main menu smoke (full runtime)
        if: matrix.group == 'unit'
        run: |
          bash docker/run-with-daemon-workspace.sh \
            --entrypoint bash \
            ${{ steps.tools.outputs.image }} /workspace/docker/main-menu-smoke.sh

      - name: Upload main menu smoke artifacts
        if: always() && matrix.group == 'unit'
        uses: actions/upload-artifact@v7
        with:
          name: main-menu-smoke
          path: build/smoke-main-menu/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint-equivalent Build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve source tool version (wait for independent publication)
        id: tools
        timeout-minutes: 125
        run: bash docker/resolve-tool-image.sh ghcr.io/${{ github.repository }}/build Dockerfile 7200 >> "$GITHUB_OUTPUT"

      - name: Run lint-equivalent debug build inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TYPE=Debug \
            ${{ steps.tools.outputs.image }}

      - name: Verify lint-equivalent build output
        run: test -x build/duel6r

  native-windows-transport:
    name: Platform / Windows MSVC x64 transport
    runs-on: windows-2025
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Start Docker service
        shell: powershell
        run: Start-Service docker

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve source tool version (wait for independent publication)
        id: tools
        shell: bash
        timeout-minutes: 125
        run: bash docker/resolve-tool-image.sh ghcr.io/${{ github.repository }}/build-windows-transport Dockerfile.windows-native-transport 7200 >> "$GITHUB_OUTPUT"

      - name: Build and test inside native Windows container
        shell: powershell
        run: .\docker\run-windows-native-transport.ps1 -Image '${{ steps.tools.outputs.image }}'

  macos:
    name: Platform / macOS native builds
    permissions:
      contents: read
    uses: ./.github/workflows/macos-build.yml
    with:
      source_sha: ${{ github.sha }}

  arm64:
    name: Platform / Linux ARM64
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/arm64.yml

  tag:
    name: Tag - sanity
    permissions:
      contents: 'write'
      packages: read
    runs-on: ubuntu-latest
    needs: [sanity, lint, native-windows-transport, macos, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Require the matching Windows cross image for nightly packaging
        timeout-minutes: 125
        run: bash docker/resolve-tool-image.sh ghcr.io/${{ github.repository }}/build-w64 Dockerfile.windows-cross 7200

      - uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: sanity
          token: ${{ secrets.PAT_ACTIONS }}

      - run: gh workflow enable develop-nightly-scheduler.yml
        env:
          GH_TOKEN: ${{ secrets.PAT_ACTIONS }}
          GH_REPO: ${{ github.repository }}
