name: Develop - Sanity
on:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build checked-out Linux build image
        run: docker build -t duel6r-build:sanity .

      - name: Build runtime bundle inside container
        run: |
          docker run --rm \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            -v "$PWD:/workspace" \
            duel6r-build:sanity

      - name: Run main menu smoke test
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/duel6r-main-menu-smoke \
            -v "$PWD:/workspace" \
            duel6r-build:sanity

      - name: Upload main menu smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-menu-smoke
          path: build/smoke-main-menu/
          if-no-files-found: ignore

  lint:
    name: Lint-equivalent Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build checked-out Linux build image
        run: docker build -t duel6r-build:lint .

      - name: Run lint-equivalent debug build inside container
        run: |
          docker run --rm \
            -e BUILD_TYPE=Debug \
            -e BUILD_TESTING=OFF \
            -v "$PWD:/workspace" \
            duel6r-build:lint

  build-images:
    name: Publish ${{ matrix.name }} Build Image
    needs: [sanity, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            dockerfile: Dockerfile
            image: build
          - name: Windows
            dockerfile: Dockerfile.windows-cross
            image: build-w64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish commit-bound image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:develop
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  tag:
    name: Tag - sanity
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [sanity, lint, build-images]
    steps:
      - name: Move sanity tag to the validated commit
        uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: sanity
          token: ${{ secrets.PAT }}

      - name: Enable the one-shot nightly scheduler
        run: gh workflow enable develop-nightly-scheduler.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.PAT }}
