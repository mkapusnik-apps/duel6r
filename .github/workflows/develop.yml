name: Develop - Sanity
on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Build checked-out Linux build image
        run: docker build -t duel6r-build:sanity .

      - name: Build runtime bundle inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            duel6r-build:sanity

      - name: Verify build output
        run: test -x build/duel6r

      - name: Run main menu smoke test
        run: |
          bash docker/run-with-daemon-workspace.sh \
            --entrypoint /usr/local/bin/duel6r-main-menu-smoke \
            duel6r-build:sanity

      - name: Upload main menu smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-menu-smoke
          path: build/smoke-main-menu/
          if-no-files-found: ignore

  lint:
    name: Lint-equivalent Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Build checked-out Linux build image
        run: docker build -t duel6r-build:lint .

      - name: Run lint-equivalent debug build inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TYPE=Debug \
            duel6r-build:lint

      - name: Verify lint-equivalent build output
        run: test -x build/duel6r

  tag:
    name: Tag - sanity
    permissions:
      contents: 'write'
    runs-on: ubuntu-latest
    needs: [sanity, lint]
    steps:
      - uses: actions/checkout@v7

      - uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: sanity
          token: ${{ secrets.PAT_ACTIONS }}

      - run: gh workflow enable develop-nightly-scheduler.yml
        env:
          GH_TOKEN: ${{ secrets.PAT_ACTIONS }}
