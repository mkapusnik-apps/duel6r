name: Develop - Sanity
on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Publish exact-SHA build images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/develop-build-image.yml

  sanity:
    name: Sanity Build
    needs: [build-images]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull exact Linux build image
        run: docker pull ghcr.io/${{ github.repository }}/build:sha-${{ github.sha }}

      - name: Build runtime bundle inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TESTING=ON \
            -e RUN_TESTS=ON \
            ghcr.io/${{ github.repository }}/build:sha-${{ github.sha }}

      - name: Upload CTest diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ctest-diagnostics-sanity
          path: build/ci-diagnostics/
          if-no-files-found: ignore

      - name: Verify build output
        run: test -x build/duel6r

      - name: Run main menu smoke test
        run: |
          bash docker/run-with-daemon-workspace.sh \
            --entrypoint /usr/local/bin/duel6r-main-menu-smoke \
            ghcr.io/${{ github.repository }}/build:sha-${{ github.sha }}

      - name: Upload main menu smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-menu-smoke
          path: build/smoke-main-menu/
          if-no-files-found: ignore

  lint:
    name: Lint-equivalent Build
    needs: [build-images]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull exact Linux build image
        run: docker pull ghcr.io/${{ github.repository }}/build:sha-${{ github.sha }}

      - name: Run lint-equivalent debug build inside container
        run: |
          bash docker/run-with-daemon-workspace.sh \
            -e BUILD_TYPE=Debug \
            ghcr.io/${{ github.repository }}/build:sha-${{ github.sha }}

      - name: Verify lint-equivalent build output
        run: test -x build/duel6r

  tag:
    name: Tag - sanity
    permissions:
      contents: 'write'
    runs-on: ubuntu-latest
    needs: [sanity, lint]
    steps:
      - uses: actions/checkout@v7

      - uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: sanity
          token: ${{ secrets.PAT_ACTIONS }}

      - run: gh workflow enable develop-nightly-scheduler.yml
        env:
          GH_TOKEN: ${{ secrets.PAT_ACTIONS }}
