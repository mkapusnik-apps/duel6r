name: macOS - Native builds

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      retention_days:
        default: 7
        type: number
      directory_default_url:
        description: Compiled directory origin; empty for unchannelled builds
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build experimental macOS app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Existing ARM64 image retires on 2026-11-02.
          - arch: arm64
            runner: macos-14
            metadata: build-info.json
          - arch: x86_64
            runner: macos-15-intel
            metadata: build-info-x86_64.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Install native build tools
        run: brew install cmake ninja pkg-config

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify Python
        env:
          D6R_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$D6R_PYTHON" --version
          "$D6R_PYTHON" -c "import platform, sys; print(sys.executable); print(platform.machine()); assert sys.version_info[:2] == (3, 13)"

      - name: Prepare runtime dependencies for the target minimum macOS
        env:
          D6R_MACOS_ARCH: ${{ matrix.arch }}
          D6R_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          mkdir -p build/macos-diagnostics
          bash macos/prepare-runtime-dependencies.sh 2>&1 | tee build/macos-diagnostics/preparation.log

      - name: Build, test, and package macOS app
        env:
          D6R_MACOS_ARCH: ${{ matrix.arch }}
          D6R_DIRECTORY_DEFAULT_URL: ${{ inputs.directory_default_url }}
          D6R_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: D6R_SOURCE_REVISION="$(git rev-parse HEAD)" bash macos/build.sh 2>&1 | tee build/macos-diagnostics/build.log

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-asset-${{ matrix.arch }}
          path: |
            build/macos/duel6r-macos-${{ matrix.arch }}.zip
            build/macos/duel6r-macos-${{ matrix.arch }}.zip.sha256
            build/macos/${{ matrix.metadata }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Collect bounded macOS phase logs
        if: failure()
        shell: bash
        run: |
          mkdir -p build/macos-diagnostics/excerpts
          for phase in preparation build ctest-interpreters ctest package; do
            log="build/macos-diagnostics/$phase.log"
            if [[ -f "$log" ]]; then
              tail -c 1048576 "$log" > "build/macos-diagnostics/excerpts/$phase.log"
            fi
          done

      - name: Upload macOS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-failure-diagnostics-${{ matrix.arch }}
          path: |
            build/macos-diagnostics/excerpts/*.log
            build/macos-build/Testing/Temporary/LastTest.log
            build/macos-build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
