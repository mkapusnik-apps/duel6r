name: Temporary macOS dependency snapshot

# One diagnostic capture only. Developer removes this file before final review.
on:
  push:
    branches: [feature/macos-apple-silicon]
    paths: [.github/workflows/macos-dependency-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SOURCE_SHA: 359f08b67f69efbad3abf28d25172b57f8103fcc
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Install the same native dependencies
        run: brew install cmake ninja pkg-config python@3.13 sdl2 sdl2_image sdl2_mixer sdl2_ttf glew

      - name: Run unchanged source and retain its result
        id: build
        continue-on-error: true
        shell: bash
        run: |
          SNAPSHOT="$RUNNER_TEMP/macos-dependency-snapshot"
          printf 'SNAPSHOT=%s\n' "$SNAPSHOT" >> "$GITHUB_ENV"
          mkdir -p "$SNAPSHOT"
          set +e
          D6R_SOURCE_REVISION="$(git rev-parse HEAD)" bash macos/build.sh 2>&1 | tee "$SNAPSHOT/build.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$SNAPSHOT/build-exit-code.txt"
          exit "$status"

      - name: Capture actual closure and license inputs
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          root = Path.cwd()
          output = Path(os.environ['SNAPSHOT'])
          cellar = Path(command('brew', '--cellar')).resolve()
          prefix = Path(command('brew', '--prefix'))
          dependency_list = root / 'build/macos-build/macos-dependencies.txt'
          origins = [Path(line) for line in dependency_list.read_text().splitlines() if line]
          if 'sdl2-compat' in (prefix / 'lib/libSDL2.dylib').resolve().parts:
              origins.append(prefix / 'lib/libSDL3.dylib')
          closure = []
          kegs = set()
          for original in origins:
              resolved = original.resolve()
              record = {'original': str(original), 'resolved': str(resolved)}
              if resolved.is_relative_to(cellar):
                  name, version, *_ = resolved.relative_to(cellar).parts
                  keg = cellar / name / version
                  kegs.add(keg)
                  record['keg'] = str(keg.relative_to(cellar))
              closure.append(record)

          provenance = {
              'purpose': 'Diagnostic snapshot only; not acceptance evidence',
              'source_sha': command('git', 'rev-parse', 'HEAD'),
              'workflow_sha': os.environ['WORKFLOW_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'job': os.environ['GITHUB_JOB'],
              'image': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'macos': command('sw_vers', '-productVersion'),
              'architecture': command('uname', '-m'),
              'sdk': command('xcrun', '--sdk', 'macosx', '--show-sdk-path'),
              'clang': command('xcrun', 'clang', '--version'),
              'cmake': command('cmake', '--version'),
              'python': command('python3', '--version'),
              'brew': command('brew', '--version'),
              'cellar': str(cellar),
              'build_exit_code': int((output / 'build-exit-code.txt').read_text()),
              'closure': closure,
              'kegs': [str(k.relative_to(cellar)) for k in sorted(kegs)],
          }
          (output / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          inputs = [(keg, 'Cellar/' + str(keg.relative_to(cellar))) for keg in sorted(kegs)]
          inputs += [
              (dependency_list, 'evidence/macos-dependencies.txt'),
              (root / 'build/macos-build/Testing/Temporary/LastTest.log', 'evidence/LastTest.log'),
              (root / 'build/macos-build/license-sources', 'license-sources'),
              (root / 'build/macos/Duel 6 Reloaded.app/Contents/Resources/licenses', 'staged-licenses'),
          ]
          inventory, missing, seen = [], [], {}
          archive = output / 'snapshot.tar.gz'
          with tarfile.open(archive, 'w:gz', dereference=False) as tar:
              for source, destination in inputs:
                  if not source.exists():
                      missing.append(destination)
                      continue
                  paths = [source]
                  if source.is_dir():
                      paths += sorted(source.rglob('*'))
                  for path in paths:
                      relative = path.relative_to(source)
                      name = destination if relative == Path('.') else destination + '/' + str(relative)
                      info = tar.gettarinfo(str(path), arcname=name)
                      record = {'path': name, 'mode': info.mode}
                      if info.issym():
                          record['symlink'] = info.linkname
                      if info.isfile():
                          with path.open('rb') as content:
                              digest = hashlib.file_digest(content, 'sha256').hexdigest()
                          record.update(sha256=digest, size=info.size)
                          # Store identical recipe/notices/source bytes only once.
                          if digest in seen:
                              info.type, info.linkname, info.size = tarfile.LNKTYPE, seen[digest], 0
                              tar.addfile(info)
                          else:
                              seen[digest] = name
                              with path.open('rb') as content:
                                  tar.addfile(info, content)
                      else:
                          tar.addfile(info)
                      inventory.append(record)
          # Missing recipe/receipt/SBOM files remain explicit, not substituted.
          metadata = {}
          for keg in sorted(kegs):
              metadata[str(keg.relative_to(cellar))] = {
                  name: (keg / name).is_file()
                  for name in ('.brew/' + keg.parent.name + '.rb', 'INSTALL_RECEIPT.json', 'sbom.spdx.json')
              }
          (output / 'inventory.json').write_text(json.dumps({
              'files': inventory, 'missing_inputs': missing, 'keg_metadata_present': metadata,
          }, indent=2) + '\n')
          with archive.open('rb') as content:
              digest = hashlib.file_digest(content, 'sha256').hexdigest()
          (output / 'snapshot.tar.gz.sha256').write_text(digest + '  snapshot.tar.gz\n')
          PY

      - name: Upload diagnostic snapshot only
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-dependency-snapshot-359f08b
          path: |
            ${{ env.SNAPSHOT }}/snapshot.tar.gz
            ${{ env.SNAPSHOT }}/snapshot.tar.gz.sha256
            ${{ env.SNAPSHOT }}/inventory.json
            ${{ env.SNAPSHOT }}/provenance.json
            ${{ env.SNAPSHOT }}/build.log
            ${{ env.SNAPSHOT }}/build-exit-code.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Preserve original build failure
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: exit "$(< "$SNAPSHOT/build-exit-code.txt")"
