name: Release Artifact

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-release-artifact:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Linux tool version from the release source
        id: linux-tools
        run: bash docker/resolve-tool-image.sh ghcr.io/${{ github.repository }}/build Dockerfile >> "$GITHUB_OUTPUT"

      - name: Resolve Windows cross tool version from the release source
        id: windows-tools
        run: bash docker/resolve-tool-image.sh ghcr.io/${{ github.repository }}/build-w64 Dockerfile.windows-cross >> "$GITHUB_OUTPUT"

      - name: Build Linux release files inside shared bundle
        run: |
          docker run --rm \
            -e D6R_DIRECTORY_DEFAULT_URL=https://duel.netusite.cz \
            -e CLEAN_OUTPUT_DIR=ON \
            -v "$PWD:/workspace" \
            ${{ steps.linux-tools.outputs.image }}

      - name: Build Windows release files inside shared bundle
        run: |
          docker run --rm \
            -e D6R_DIRECTORY_DEFAULT_URL=https://duel.netusite.cz \
            -e BUILD_TESTING=OFF \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=OFF \
            -v "$PWD:/workspace" \
            ${{ steps.windows-tools.outputs.image }}

      - name: Verify shared release bundle
        run: |
          test -x build/duel6r
          test -f build/duel6r.exe
          test -d build/data
          test -d build/levels
          test -d build/profiles
          test -d build/shaders
          test -d build/sound
          test -d build/textures

      - name: Package release artifact
        id: package
        shell: bash
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          archive_name="duel6r-${safe_ref}.zip"

          ARCHIVE_NAME="$archive_name" python - <<'PY'
          import os
          import zipfile

          archive_name = os.environ["ARCHIVE_NAME"]
          root = "build"

          with zipfile.ZipFile(archive_name, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for current_root, _, files in os.walk(root):
                  for file_name in files:
                      path = os.path.join(current_root, file_name)
                      archive.write(path, path)
          PY

          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 7

  publish-github-release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.zip
          generate_release_notes: true

      - name: Log in to GHCR for the dedicated server image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Package and publish the Linux amd64 dedicated server
        env:
          IMAGE: ghcr.io/${{ github.repository }}/dedicated-server
        run: |
          unzip -q release-assets/*.zip -d dedicated-runtime
          docker build --pull --platform linux/amd64 --file docker/dedicated/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:release-${GITHUB_SHA}" --tag "${IMAGE}:release" dedicated-runtime/build
          docker push "${IMAGE}:release-${GITHUB_SHA}"
          docker push "${IMAGE}:release"
