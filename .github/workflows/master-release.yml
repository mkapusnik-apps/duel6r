name: Release Artifact

on:
  push:
    branches: [master]
    tags: [released]
  workflow_dispatch:

jobs:
  build-release-artifact:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux release files inside shared bundle
        run: |
          docker run --rm --pull always \
            -e BUILD_TESTING=OFF \
            -e CLEAN_OUTPUT_DIR=ON \
            -v "$PWD:/workspace" \
            ghcr.io/${{ github.repository }}/build:develop

      - name: Build Windows release files inside shared bundle
        run: |
          docker run --rm --pull always \
            -e BUILD_TESTING=OFF \
            -e RUN_TESTS=OFF \
            -e CLEAN_OUTPUT_DIR=OFF \
            -v "$PWD:/workspace" \
            ghcr.io/${{ github.repository }}/build-w64:develop

      - name: Package release artifact
        id: package
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          archive_name="duel6r-${safe_ref}.zip"
          bash docker/validate-bundle.sh all build
          python3 -m zipfile -c "$archive_name" build
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

  publish-github-release-assets:
    if: github.event_name == 'push' && github.ref == 'refs/tags/released'
    needs: build-release-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out promoted source
        uses: actions/checkout@v7

      - name: Validate stable promotion from master and nightly
        run: |
          git fetch --force --no-tags origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/tags/nightly:refs/tags/nightly

          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          master_commit="$(git rev-parse "refs/remotes/origin/master^{commit}")"
          nightly_commit="$(git rev-parse "refs/tags/nightly^{commit}")"

          test "${release_commit}" = "${master_commit}"
          test "$(git rev-parse "${release_commit}^{tree}")" = "$(git rev-parse "${nightly_commit}^{tree}")"
          test "$(gh release view nightly --repo "${{ github.repository }}" --json isPrerelease,assets --jq '(.isPrerelease == true) and any(.assets[]; .name == "duel6r-nightly.zip")')" = "true"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
