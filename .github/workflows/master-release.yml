name: Release Artifact

on:
  workflow_dispatch:

concurrency:
  group: canonical-release-publication
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Validated Nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Resolve the current promotion candidate
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/master"

          master_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)"
          nightly_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" --jq .object.sha)"
          master_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${master_commit}" --jq .tree.sha)"
          nightly_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${nightly_commit}" --jq .tree.sha)"

          test "${GITHUB_SHA}" = "${master_commit}"
          test "${master_tree}" = "${nightly_tree}"
          if gh release view released --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A GitHub release must never be attached to the moving released ref" >&2
            exit 1
          fi
          printf '%s\n' \
            "master_commit=${master_commit}" \
            "nightly_commit=${nightly_commit}" \
            "source_tree=${nightly_tree}" \
            "archive_name=duel6r-nightly-${nightly_commit}.zip" \
            "provenance_name=duel6r-nightly-${nightly_commit}.provenance.json" \
            "stable_tag=released-${master_commit}" \
            >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out exact master tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.refs.outputs.master_commit }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download exact nightly release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view nightly --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "true"
          gh release download nightly --repo "${GITHUB_REPOSITORY}" \
            --pattern "${{ steps.refs.outputs.archive_name }}" \
            --pattern "${{ steps.refs.outputs.provenance_name }}" \
            --dir promotion-assets
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate nightly provenance, images, and bundle
        shell: bash
        run: |
          set -euo pipefail
          provenance="promotion-assets/${{ steps.refs.outputs.provenance_name }}"
          archive="promotion-assets/${{ steps.refs.outputs.archive_name }}"
          linux_image="$(jq -er '.build_images.linux' "${provenance}")"
          windows_image="$(jq -er '.build_images.windows' "${provenance}")"

          python3 docker/nightly-provenance.py verify \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${{ steps.refs.outputs.nightly_commit }}" \
            --tree "${{ steps.refs.outputs.source_tree }}" \
            --linux-image "${linux_image}" \
            --windows-image "${windows_image}" \
            --archive "${archive}" \
            --provenance "${provenance}"
          for image in "${linux_image}" "${windows_image}"; do
            docker pull "${image}" >&2
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")" \
              = "${{ steps.refs.outputs.nightly_commit }}"
          done

          mkdir extracted-bundle
          unzip -q "${archive}" -d extracted-bundle
          bash docker/validate-bundle.sh all extracted-bundle/build

      - name: Retain exact promotion candidate
        uses: actions/upload-artifact@v7
        with:
          name: stable-promotion-${{ steps.refs.outputs.master_commit }}
          path: promotion-assets/
          if-no-files-found: error

      - name: Stage and verify immutable stable release
        run: >-
          bash .github/scripts/publish-stable-release.sh
          "${GITHUB_REPOSITORY}"
          "${{ steps.refs.outputs.master_commit }}"
          "promotion-assets/${{ steps.refs.outputs.archive_name }}"
          "promotion-assets/${{ steps.refs.outputs.provenance_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Revalidate remote refs immediately before canonical promotion
        shell: bash
        run: |
          set -euo pipefail
          master_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)"
          nightly_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" --jq .object.sha)"
          stable_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${{ steps.refs.outputs.stable_tag }}" --jq .object.sha)"

          test "${master_commit}" = "${{ steps.refs.outputs.master_commit }}"
          test "${nightly_commit}" = "${{ steps.refs.outputs.nightly_commit }}"
          test "${stable_commit}" = "${master_commit}"
          if gh release view released --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A GitHub release must never be attached to the moving released ref" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Move canonical released ref to the completely published master tip
        uses: mkapusnik-apps/commons/tag@v1
        with:
          tag: released
          commit_sha: ${{ steps.refs.outputs.master_commit }}
          token: ${{ secrets.PAT }}
