global
    user haproxy
    group haproxy
    maxconn 64
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend public_game
    bind 0.0.0.0:26660 ssl crt /etc/duel6r/tls.pem
    default_backend dedicated

backend dedicated
    # No SSL TLVs: application accepts only IPv4 PROXY v2 address length 12.
    server game 127.0.0.1:26661 send-proxy-v2
