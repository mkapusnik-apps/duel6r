<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
  <title id="title">CONS-01 — Console over the main menu</title>
  <desc id="desc">1920 by 1080 client. The opaque console spans the full client width at the top and remains at client scale. It contains up to fifteen history rows, a separator row, an input prompt and cursor, and a three-pixel bottom edge. The unchanged centered 850 by 700 menu below it is scaled to 135 percent, independently of the console. External annotations explain colors and input without adding UI.</desc>
  <rect width="1920" height="1240" fill="white"/>
  <rect x="1" y="1" width="1918" height="1078" fill="none" stroke="black" stroke-width="2"/>
  <g transform="translate(386 67) scale(1.35)" font-family="sans-serif" font-size="16" fill="black">
    <rect width="850" height="700" fill="white" stroke="black" stroke-width="2"/>
    <g fill="none" stroke="black">
      <rect x="325" y="5" width="200" height="95"/>
      <rect x="10" y="122" width="315" height="325"/><rect x="330" y="122" width="315" height="325"/><rect x="650" y="122" width="190" height="325"/>
      <path d="M10 140H325 M330 140H645 M650 140H840"/>
      <rect x="16" y="146" width="303" height="224"/><path d="M16 162H319"/>
      <rect x="336" y="146" width="303" height="240"/>
      <rect x="16" y="378" width="249" height="25"/><rect x="273" y="378" width="46" height="25"/>
      <rect x="16" y="412" width="70" height="25"/><rect x="287" y="412" width="32" height="25"/>
      <rect x="336" y="412" width="32" height="25"/><rect x="549" y="412" width="90" height="25"/>
      <rect x="656" y="148" width="178" height="24"/>
      <rect x="658" y="184" width="16" height="16"/><rect x="658" y="216" width="16" height="16"/><rect x="658" y="248" width="16" height="16"/>
      <path d="M660 188L665 195L672 186 M660 220L665 227L672 218 M660 252L665 259L672 250"/>
      <rect x="722" y="280" width="110" height="24"/>
      <rect x="10" y="457" width="830" height="149"/><path d="M10 480H840"/>
      <rect x="56" y="630" width="150" height="50"/><rect x="252" y="630" width="150" height="50"/><rect x="448" y="630" width="150" height="50"/><rect x="644" y="630" width="150" height="50"/>
    </g>
    <text x="425" y="58" text-anchor="middle">Animated banner</text><text x="425" y="116" text-anchor="middle">version &lt;runtime&gt;</text>
    <text x="18" y="136">PERSONS</text><text x="338" y="136">PLAYERS 2</text><text x="658" y="136">GAME SETTINGS</text>
    <g font-size="14">
      <text x="24" y="158">Rank</text><text x="76" y="158">Name</text><text x="200" y="158">Elo</text><text x="252" y="158">Trend</text>
      <text x="76" y="184">Alice</text><text x="76" y="208">Bruno</text><text x="76" y="232">Cora</text><text x="76" y="256">Diego</text>
      <text x="344" y="184">Alice</text><text x="454" y="184">K1: Arrows</text><text x="616" y="184">D</text>
      <text x="344" y="208">Bruno</text><text x="454" y="208">K2: WSAD</text><text x="616" y="208">D</text>
      <text x="682" y="166">Deathmatch</text><text x="682" y="198">Assistance</text><text x="682" y="230">Quick Liquid</text><text x="682" y="262">Burnable Trees</text>
      <text x="658" y="298">Rounds</text><text x="730" y="298">0</text>
      <text x="296" y="396" text-anchor="middle">Add</text><text x="51" y="430" text-anchor="middle">Remove</text>
      <text x="303" y="430" text-anchor="middle">&gt;&gt;</text><text x="352" y="430" text-anchor="middle">&lt;&lt;</text><text x="594" y="430" text-anchor="middle">Detect All</text>
    </g>
    <text x="18" y="473" font-size="12">Name   Elo   Pts   Win   Kill   Assist   Pen   Death   K/D   Shot   Acc.   GmTm   Dmg</text>
    <g text-anchor="middle">
      <text x="131" y="660">Play (F1)</text><text x="327" y="660">Network (F2)</text><text x="523" y="660">Clear (F3)</text><text x="719" y="660">Quit (ESC)</text>
    </g>
  </g>
  <g id="console" font-family="monospace" font-size="16" fill="black">
    <rect x="1" y="1" width="1918" height="275" fill="white" stroke="black"/>
    <text x="8" y="16">Loading resources…</text><text x="8" y="32">Loading profiles…</text><text x="8" y="48">Scanning controllers…</text>
    <text x="8" y="64">…</text>
    <text x="8" y="240">Ready.</text>
    <text x="8" y="256" textLength="1904" lengthAdjust="spacing">=======================================================================================================================</text>
    <text x="8" y="272">]_</text>
    <rect x="1" y="275" width="1918" height="3" fill="black"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="black">
    <text x="24" y="1116">ANNOTATIONS — not UI. Console: full client width, unscaled; up to 15 history rows, separator, input, and 3 px lower edge.</text>
    <text x="24" y="1144">Production console is opaque yellow with a red separator. The cursor blinks; scrolled history uses ^ and long input uses &lt;.</text>
    <text x="24" y="1172">Underlying MENU-01 remains centered at 135%, with its unchanged four-action footer, checked Burnable Trees and session background.</text>
    <text x="24" y="1200">Menu detail and history values are illustrative. Keyboard/text input goes to the console; existing mouse routing remains unchanged.</text>
  </g>
</svg>
