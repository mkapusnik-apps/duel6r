<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
  <title id="title">MENU-01-A — Non-Team session setup</title>
  <desc id="desc">1920 by 1080 desktop client, with an 850 by 700 logical menu uniformly scaled to 135 percent at recorded origin 386,67. Persons and Players each occupy 315 logical pixels, separated from each other and the 190-pixel Game Settings panel by five-pixel gaps. Eight saved persons and eight roster players are illustrative. Team settings and roster-order controls are absent. Annotation space below the client is not UI.</desc>
