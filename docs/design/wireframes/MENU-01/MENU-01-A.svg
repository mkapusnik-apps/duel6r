  <g font-family="sans-serif" font-size="20" fill="black">
    <text x="24" y="1116">ANNOTATIONS — not UI. The outer region represents the session-persistent blurred gameplay still with a 55% black scrim.</text>
    <text x="24" y="1144">Canvas: 850 × 700 at 135%; no reflow. Schematic monochrome text and frames do not replace the production design system.</text>
    <text x="24" y="1172">Cora is selected. Ranked rows have Rank/Elo/Trend; unranked rows leave those cells empty. All eight persons also remain in Players.</text>
    <text x="24" y="1200">No Team settings, Equalize, Shuffle, residual button frames or targets. Hidden values remain four teams / Friendly Fire on.</text>
    <text x="24" y="1228">Lists retain overflow behavior and support 15 roster slots. Name and action rows retain their documented alignment; sample values are not fixed UI.</text>
  </g>
