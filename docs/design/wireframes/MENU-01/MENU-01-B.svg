<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
  <title id="title">MENU-01-B — Teams session setup</title>
  <desc id="desc">1920 by 1080 desktop client with the same scaled 850 by 700 menu as MENU-01-A. Eight saved persons and six selected players illustrate Teams, two teams, Friendly Fire off and Rounds zero. Team settings appear in one compact stack; Equalize and Shuffle form a centered group between the Players edge actions. Team colors are described outside the UI rather than replaced by invented roster badges.</desc>
