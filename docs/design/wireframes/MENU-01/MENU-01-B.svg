  <g font-family="sans-serif" font-size="20" fill="black">
    <text x="24" y="1116">ANNOTATIONS — not UI. Same session background, centered 135% canvas, panel bounds and action-row positions as MENU-01-A.</text>
    <text x="24" y="1144">Players use alternating Alpha red / Bravo green row colors for two teams; monochrome omits production colors, not team assignment.</text>
    <text x="24" y="1172">Cora remains selected in Persons. No roster badge or team label is added to person rows or player rows.</text>
    <text x="24" y="1200">Equalize and Shuffle are centered between &lt;&lt; and Detect All. All six bottom setup actions share one height and caption clearance.</text>
    <text x="24" y="1228">Eight saved persons, six roster players, two teams, Friendly Fire off and Rounds 0. Lists scroll for overflow; production styling remains unchanged.</text>
