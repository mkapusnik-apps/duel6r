<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
  <title>NET-01 — Network entry modal</title>
  <desc>Initial inactive NET-01 over actual retained MENU-01. 850 by 700 logical desktop canvas. Centered 380 by 210 popup. Reading and focus order: Host, Join, Back. Host has initial focus. Underlying menu input is blocked. No scrolling.</desc>
  <rect width="900" height="800" fill="white"/>
  <g fill="none" stroke="black">
    <rect x="25" y="20" width="850" height="700"/>
    <rect x="350" y="45" width="200" height="95"/>
    <rect x="35" y="220" width="315" height="370"/>
    <rect x="355" y="220" width="315" height="370"/>
    <rect x="675" y="220" width="190" height="370"/>
    <rect x="35" y="635" width="190" height="32"/>
    <rect x="240" y="635" width="190" height="32"/>
    <rect x="445" y="635" width="190" height="32"/>
    <rect x="650" y="635" width="190" height="32"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="450" y="98">Existing banner / version</text>
    <text x="192" y="245">Persons</text>
    <text x="512" y="245">Players / controls</text>
    <text x="770" y="245">Game settings</text>
    <text x="130" y="657">Play (F1)</text>
    <text x="335" y="657">Network (F2)</text>
    <text x="540" y="657">Clear (F3)</text>
    <text x="745" y="657">Quit (ESC)</text>
  </g>
  <g fill="white" stroke="black">
    <rect x="260" y="265" width="380" height="210"/>
    <rect x="262" y="267" width="376" height="18"/>
    <rect x="297" y="304" width="306" height="38" stroke-width="2"/>
    <rect x="300" y="307" width="300" height="32"/>
    <rect x="300" y="352" width="300" height="32"/>
    <rect x="300" y="397" width="300" height="32"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="450" y="281">NETWORK PLAY</text>
    <text x="450" y="329">Host</text>
    <text x="450" y="374">Join</text>
    <text x="450" y="419">Back</text>
  </g>
  <g fill="black" font-family="sans-serif" font-size="14">
    <text x="25" y="748">Annotation: Main-menu groups are context only; retain actual MENU-01 layout and values.</text>
    <text x="25" y="770">Double outline: initial Host focus. Join opens existing NET-10. Underlying input is blocked.</text>
    <text x="25" y="792">Use existing canvas scale. No scope copy, scrolling, or new destination flow.</text>
  </g>
</svg>
