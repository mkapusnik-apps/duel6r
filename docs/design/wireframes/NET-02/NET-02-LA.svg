<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850">
  <title>NET-02-LA — Listening popup, wildcard mode</title>
  <desc>NET-02-listening-popup with NET-02-listen-all. Fixed mode row, help, scrolling disabled address list and Close over the existing editable setup. Black and white structural diagram; annotations are outside the canvas.</desc>
  <rect width="900" height="850" fill="white"/>
  <g fill="none" stroke="black">
    <rect x="25" y="20" width="850" height="700"/>
    <rect x="350" y="40" width="200" height="95"/>
    <rect x="285" y="207" width="540" height="24"/>
    <rect x="285" y="239" width="540" height="24"/>
    <rect x="75" y="330" width="350" height="190"/>
    <rect x="455" y="330" width="370" height="190"/>
    <rect x="295" y="621" width="310" height="32"/>
    <rect x="295" y="665" width="310" height="32"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16">
    <text x="363" y="92">Existing banner / version</text>
    <text x="320" y="180">HOST NETWORK SESSION</text>
    <text x="75" y="225">Port</text><text x="295" y="225">26660</text>
    <text x="75" y="257">Listening interface</text><text x="295" y="257">Listen on all (0.0.0.0) [popup]</text>
    <text x="87" y="349">PERSONS</text>
    <text x="75" y="544">Local players: 1 • Lobby 1–15 • Match 2–15</text>
    <text x="75" y="566">Session-only scores • Optional scripts disabled</text>
    <text x="75" y="588">Listing does not guarantee reachability. Direct play remains available.</text>
    <text x="75" y="610">Validation / startup feedback</text>
    <text x="397" y="643">Start session</text><text x="432" y="687">Back</text>
  </g>
  <rect x="285" y="271" width="540" height="249" fill="white" stroke="black"/>
  <g fill="none" stroke="black">
    <path d="M285 297H825"/>
    <rect x="295" y="305" width="520" height="28" stroke-width="2"/>
    <rect x="301" y="311" width="16" height="16"/>
    <rect x="295" y="385" width="520" height="78"/>
    <rect x="303" y="391" width="16" height="16"/>
    <rect x="303" y="416" width="16" height="16"/>
    <rect x="303" y="441" width="16" height="16"/>
    <rect x="715" y="480" width="100" height="28"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16">
    <text x="297" y="290">LISTENING INTERFACE</text>
    <text x="302" y="325">✓</text><text x="327" y="325">Listen on all</text>
    <text x="297" y="352">Uses 0.0.0.0. The operating system controls coverage.</text>
    <text x="297" y="376">Turn off Listen on all to choose individual addresses.</text>
    <text x="304" y="405">✓</text><text x="329" y="405">127.0.0.1 — Same machine (disabled)</text>
    <text x="304" y="430">✓</text><text x="329" y="430">192.168.1.24 — Private LAN (disabled)</text>
    <text x="304" y="455">✓</text><text x="329" y="455">10.0.0.8 — Private LAN (disabled)</text>
    <text x="297" y="499">Changes are kept when closed.</text><text x="744" y="499">Close</text>
  </g>
  <g fill="black" font-family="sans-serif" font-size="14">
    <text x="25" y="755">ANNOTATIONS — structural allocation only. Address literals are example assigned inputs.</text>
    <text x="25" y="779">Read heading → focused mode → help → address list → Close. Disabled rows cannot toggle.</text>
    <text x="25" y="803">Only address rows scroll. Mode/help/Close and the underlying validation/footer stay fixed.</text>
    <text x="25" y="827">Popup owns focus/pointer input. Back closes and retains changes. No service starts here.</text>
  </g>
</svg>
