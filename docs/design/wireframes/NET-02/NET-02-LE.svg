<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850">
  <title>NET-02-LE — Listening popup, explicit subset</title>
  <desc>NET-02-listening-popup with NET-02-listen-explicit. Popup geometry, independent checkboxes, help and Close remain unchanged. Underlying panels/list bodies gain 44 logical px downward; count and feedback move down by 44. Bottom-left logical action bounds are Start session (117,38,300,32) and Back (433,38,300,32), translated exactly to canvas origin (25,20). Other positions remain structural approximations; the NET-02 geometry table owns exact list bounds. Empty/invalid variants keep validation above the row. No listing/direct-play help or idle readiness text.</desc>
  <rect width="900" height="850" fill="white"/>
  <g fill="none" stroke="black">
    <rect x="25" y="20" width="850" height="700"/>
    <rect x="350" y="40" width="200" height="95"/>
    <rect x="285" y="207" width="540" height="24"/>
    <rect x="285" y="239" width="540" height="24"/>
    <rect x="75" y="330" width="350" height="234"/>
    <rect x="455" y="330" width="370" height="234"/>
    <rect x="142" y="650" width="300" height="32"/>
    <rect x="458" y="650" width="300" height="32"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16">
    <text x="363" y="92">Existing banner / version</text>
    <text x="320" y="180">HOST NETWORK SESSION</text>
    <text x="75" y="225">Port</text><text x="295" y="225">26660</text>
    <text x="75" y="257">Listening interface</text><text x="295" y="257">Explicit: 2 addresses [popup]</text>
    <text x="87" y="349">PERSONS</text>
    <text x="75" y="588">Local players: 1 • Lobby 1–15 • Match 1–15</text>
    <text x="75" y="610">Session-only scores • Optional scripts disabled</text>
    <text x="292" y="672" text-anchor="middle">Start session</text><text x="608" y="672" text-anchor="middle">Back</text>
  </g>
  <rect x="285" y="271" width="540" height="249" fill="white" stroke="black"/>
  <g fill="none" stroke="black">
    <path d="M285 297H825"/>
    <rect x="301" y="311" width="16" height="16"/>
    <rect x="295" y="385" width="520" height="78"/>
    <rect x="303" y="391" width="16" height="16"/>
    <rect x="303" y="416" width="16" height="16"/>
    <rect x="297" y="412" width="512" height="24" stroke-width="2"/>
    <rect x="303" y="441" width="16" height="16"/>
    <rect x="715" y="480" width="100" height="28"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16">
    <text x="297" y="290">LISTENING INTERFACE</text>
    <text x="327" y="325">Listen on all</text>
    <text x="297" y="352">Only checked addresses will listen on the selected port.</text>
    <text x="297" y="376">Every selected bind must succeed.</text>
    <text x="304" y="405">✓</text><text x="329" y="405">127.0.0.1 — Same machine</text>
    <text x="304" y="430">✓</text><text x="329" y="430">192.168.1.24 — Private LAN</text>
    <text x="329" y="455">10.0.0.8 — Private LAN</text>
    <text x="297" y="499">Changes are kept when closed.</text><text x="744" y="499">Close</text>
  </g>
  <g fill="black" font-family="sans-serif" font-size="14">
    <text x="25" y="755">ANNOTATIONS — independent enabled checkboxes; second row focused; literals are examples.</text>
    <text x="25" y="779">Empty variant: all unchecked; fixed validation requests at least one interface; Start disabled.</text>
    <text x="25" y="803">Stale variant: checked unavailable literal remains clearable; fixed validation; Start disabled.</text>
    <text x="25" y="827">Only addresses scroll. Mode/help/Close stay fixed. Escape/Back retains changes and field focus.</text>
  </g>
</svg>
