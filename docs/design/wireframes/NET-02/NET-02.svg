<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820">
  <title>NET-02 — Host setup with optional password</title>
  <desc>850 by 700 logical canvas with fixed banner, endpoint fields, status, and footer. Two scrolling player setup panels share the remaining body. Port keeps initial focus.</desc>
  <rect width="900" height="820" fill="white"/>
  <g fill="none" stroke="black">
    <rect x="25" y="20" width="850" height="700"/>
    <rect x="350" y="40" width="200" height="95"/>
    <rect x="285" y="207" width="540" height="24" stroke-width="2"/>
    <rect x="285" y="239" width="540" height="24"/>
    <rect x="285" y="271" width="540" height="24"/>
    <rect x="75" y="330" width="350" height="190"/>
    <rect x="455" y="330" width="370" height="190"/>
    <path d="M75 356H425 M455 356H825"/>
    <rect x="295" y="621" width="310" height="32"/>
    <rect x="295" y="665" width="310" height="32"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16">
    <text x="363" y="92">Existing banner / version</text>
    <text x="320" y="180">HOST NETWORK SESSION</text>
    <text x="75" y="225">Port</text><text x="295" y="225">26660</text>
    <text x="75" y="257">Listening interface</text><text x="295" y="257">192.168.1.24 (Private LAN) [selector]</text>
    <text x="75" y="289">Password (optional)</text><text x="295" y="289">********</text>
    <text x="285" y="316">Leave empty for no password.</text>
    <text x="87" y="349">PERSONS</text><text x="467" y="349">LOCAL PLAYERS AND CONTROLS</text>
    <text x="87" y="382">Ada • Selected</text><text x="467" y="382">Ada • Keyboard 1       Remove</text>
    <text x="87" y="408">Bruno • Add</text>
    <text x="87" y="496">Remaining persons scroll</text><text x="467" y="496">Remaining player rows scroll</text>
    <text x="75" y="544">Local players: 1 • Lobby 1–15 • Match 2–15</text>
    <text x="75" y="566">Session-only scores • Optional scripts disabled</text>
    <text x="75" y="588">Listing does not guarantee reachability. Direct play remains available.</text>
    <text x="75" y="610">Validation / startup feedback</text>
    <text x="397" y="643">Start session</text><text x="432" y="687">Back</text>
  </g>
  <g font-family="sans-serif" font-size="14">
    <text x="25" y="755">Annotation: Read top to bottom; left setup panel before right. Password is masked.</text>
    <text x="25" y="777">Keep fixed footer. Interface options overlay only the body. No new styling tokens.</text>
  </g>
</svg>
