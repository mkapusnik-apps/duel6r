<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820">
  <title>NET-03-E — Editable directory or direct join</title>
  <desc>Shared join task with endpoint, password, two player setup panels, contextual admission feedback, and fixed Connect and Back actions. Password receives initial focus for a protected directory selection.</desc>
  <rect width="900" height="820" fill="white"/>
  <g fill="none" stroke="black">
    <rect x="25" y="20" width="850" height="700"/>
    <rect x="350" y="40" width="200" height="95"/>
    <rect x="245" y="207" width="580" height="24"/>
    <rect x="245" y="239" width="580" height="24"/>
    <rect x="245" y="271" width="580" height="24" stroke-width="2"/>
    <rect x="75" y="330" width="350" height="174"/>
    <rect x="455" y="330" width="370" height="174"/>
    <path d="M75 356H425 M455 356H825"/>
    <rect x="295" y="621" width="310" height="32"/>
    <rect x="295" y="665" width="310" height="32"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="16">
    <text x="363" y="92">Existing banner / version</text>
    <text x="330" y="180">JOIN NETWORK SESSION</text>
    <text x="75" y="225">Address</text><text x="255" y="225">192.168.1.24</text>
    <text x="75" y="257">Port</text><text x="255" y="257">26660</text>
    <text x="75" y="289">Password</text><text x="255" y="289">********</text>
    <text x="245" y="316">Password required</text>
    <text x="87" y="349">PERSONS</text><text x="467" y="349">LOCAL PLAYERS AND CONTROLS</text>
    <text x="87" y="382">Cora • Selected</text><text x="467" y="382">Cora • Keyboard 1       Remove</text>
    <text x="87" y="408">Dara • Add</text>
    <text x="87" y="482">Remaining persons scroll</text><text x="467" y="482">Remaining player rows scroll</text>
    <text x="75" y="530">Local players: 1 • Session-only scores • Optional scripts disabled</text>
    <text x="75" y="553">Selected session: 192.168.1.24:26660</text>
    <text x="75" y="576">Round 1 in progress. You will play immediately if admitted.</text>
    <text x="75" y="599">The host confirms availability when you connect.</text>
    <text x="420" y="643">Connect</text><text x="432" y="687">Back</text>
  </g>
  <g font-family="sans-serif" font-size="14">
    <text x="25" y="755">Annotation: Direct path uses optional-password help and initial Address focus.</text>
    <text x="25" y="777">Connecting uses existing NET-03 locked-roster layout; no additional password dialog.</text>
  </g>
</svg>
