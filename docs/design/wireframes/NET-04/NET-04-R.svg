<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940">
  <title>NET-04-R — Lobby with retained complete outcomes</title>
  <desc>Top-left wireframe coordinates. Fixed 850 by 700 logical menu canvas. Current membership and settings remain above a bounded retained-result region. Result rows scroll independently of outcome labels and footer actions.</desc>
  <rect width="900" height="940" fill="white"/>
  <g fill="none" stroke="black" stroke-width="1">
    <rect x="25" y="20" width="850" height="700"/>
    <rect x="49" y="105" width="524" height="235"/>
    <rect x="581" y="105" width="270" height="235"/>
