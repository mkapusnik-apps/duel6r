<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940">
  <title>NET-04-R — Lobby with retained complete outcomes</title>
  <desc>Top-left wireframe coordinates. Fixed 850 by 700 logical menu canvas. Current membership and settings remain above a bounded retained-result region. Result rows retain working scrolling independently of outcome labels and footer actions. Plain host-only help identifies the existing reorder access path; the actual reorder action and pointer target remain focus-dependent. Values illustrate content extremes, not the required capture dataset.</desc>
