    <rect x="62" y="546" width="26" height="20"/>
    <rect x="96" y="550" width="395" height="12"/>
    <rect x="96" y="550" width="100" height="12"/>
    <rect x="500" y="546" width="26" height="20"/>
    <rect x="49" y="645" width="130" height="38"/>
    <rect x="195" y="645" width="245" height="38"/>
