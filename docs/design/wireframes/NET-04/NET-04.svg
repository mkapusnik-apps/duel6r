  <g font-family="sans-serif" font-size="13" fill="black">
    <text x="390" y="85">Existing banner</text>
    <text x="395" y="153">Runtime version</text>
    <text x="65" y="188">Host • Network session • endpoint • 2 participants • 2 players</text>
    <text x="65" y="211">Directory status / existing publication recovery</text>
    <text x="73" y="258">PARTICIPANTS</text>
    <text x="73" y="282">Role       Connection       Readiness       Owned</text>
    <text x="73" y="307">Host       Connected        Not ready       1</text>
    <text x="73" y="320">Guest      Connected        Not ready       1</text>
    <text x="73" y="350">PLAYERS AND CONTROLS</text>
    <text x="73" y="375">Pos    Owner               Person                   Control             Order</text>
    <text x="73" y="403">1        Host</text><text x="231" y="403">Ada [owned]</text><text x="411" y="403">Keyboard</text><text x="561" y="403">↕</text>
    <text x="73" y="427">2        Guest</text><text x="231" y="427">Cora [read-only]</text><text x="411" y="427">Read-only</text><text x="561" y="427">↕</text>
    <text x="73" y="461">Only current participant's person/control values are editable.</text>
    <text x="73" y="485">Roster rows scroll; headings remain fixed.</text>
    <text x="611" y="258">HOST MATCH SETTINGS</text>
    <text x="613" y="288">↻ Mode:</text><text x="668" y="288">Team deathmatch</text>
    <text x="613" y="312">↻ Teams:</text><text x="671" y="312">4</text>
    <text x="633" y="336">Friendly fire: On</text>
    <text x="613" y="360">↻</text><text x="635" y="360">Shuffle all levels</text>
    <text x="613" y="384">↻ Level:</text><text x="658" y="384">Selected level</text>
    <text x="613" y="408">↻ Rounds 1–99:</text><text x="740" y="408">99</text>
    <text x="633" y="432">Assistance: On</text>
    <text x="633" y="456">Quick Liquid: Off</text>
    <text x="633" y="480">Burnable Trees: On</text>
    <text x="65" y="583">Waiting for Guest to be ready</text>
    <text x="65" y="611">Optional scripts are disabled for network play.</text>
    <text x="92" y="672">Ready / Not ready</text><text x="447" y="672">Start match — disabled</text><text x="716" y="672">End session</text>
    <text x="25" y="764">ANNOTATIONS — not interface copy; structure only, not production appearance</text>
    <text x="25" y="789">↻ identifies one forward-cycle row. Square + On/Off identifies one toggle row. Whole row activates.</text>
    <text x="25" y="814">Guest: read-only values, no cycle markers or enabled squares. Hidden Team rows collapse without targets.</text>
    <text x="25" y="839">UX-NET-04-006/019–031. Preserve focus traversal, pointer press timing, host permissions and readiness.</text>
  </g>
