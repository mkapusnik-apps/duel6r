    <rect x="61" y="481" width="165" height="24"/>
    <rect x="365" y="481" width="190" height="24"/>
    <rect x="49" y="645" width="130" height="38"/>
    <rect x="195" y="645" width="245" height="38"/>
    <rect x="456" y="645" width="180" height="38"/>
  </g>
