    <text x="395" y="153">Runtime version</text>
    <text x="65" y="188">Host • Dedicated session • 2 participants • 2 players</text>
    <text x="65" y="211">Endpoint: actual operator hostname or IPv4 and port</text>
    <text x="65" y="232">You control this session. Leaving ends it for everyone.</text>
