<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850">
  <title>NET-04 — Host lobby game-settings structure</title>
  <desc>Fixed 850 by 700 logical desktop canvas. Existing participant and roster regions remain left of the vertical host-settings stack. Each setting has one whole-row target. Cycle values have no directional buttons or text-entry caret. Checkbox squares are state indicators within existing toggle rows. Diagram values are examples, not capture data.</desc>
