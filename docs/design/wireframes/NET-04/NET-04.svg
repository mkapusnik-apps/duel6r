  <title>NET-04 — Confirmed lobby with pilot header variant</title>
  <desc>Existing 850 by 700 desktop canvas and banner. Fixed role, endpoint and status above two-thirds membership and one-third host settings. Pilot role copy occupies the same header region as player-hosted listing feedback. Lists scroll under fixed headings. Feedback and role-correct footer remain fixed.</desc>
