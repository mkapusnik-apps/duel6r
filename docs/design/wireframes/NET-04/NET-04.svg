    <text x="25" y="764">ANNOTATIONS — structure only. Retain current develop's settings layout and whole-row input.</text>
    <text x="25" y="789">Player-hosted header retains directory feedback. Dedicated header has no publication target.</text>
    <text x="25" y="814">Guest: its consequence note, owned-slot editing, plain read-only settings and Leave.</text>
    <text x="25" y="839">UX-NET-04-006/019–031 remain fixed. Long endpoints stay in the separate bounded header row.</text>
