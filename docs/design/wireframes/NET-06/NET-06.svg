<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1086" viewBox="0 0 1280 1086">
  <title>NET-06 — Common final shell, network role variants</title>
  <desc>Same unchanged arena-backed final shell as OVER-03. Reference-style score tables use 32 px rows and pipe separators; supporting outcome, settings and descriptive detail stay compact. Wide network content retains bounded navigation. Host actions are drawn; Guest is a footer variant.</desc>
  <defs><clipPath id="score-viewport"><rect x="80" y="202" width="1112" height="510"/></clipPath></defs>
  <rect width="1280" height="1086" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <rect x="1" y="1" width="1278" height="898"/>
    <rect x="48" y="16" width="1184" height="748"/>
    <rect x="50" y="18" width="1180" height="40"/>
    <rect x="936" y="22" width="278" height="32"/>
    <rect x="64" y="146" width="1152" height="602"/>
    <rect x="80" y="166" width="1112" height="36"/>
    <path d="M80 234 H1192 M80 266 H1192 M80 398 H1192 M80 434 H1192 M80 566 H1192 M80 602 H1192"/>
    <rect x="1200" y="234" width="12" height="478"/>
    <rect x="1202" y="236" width="8" height="170"/>
    <rect x="80" y="712" width="1112" height="24"/>
    <rect x="46" y="778" width="224" height="44"/>
    <rect x="48" y="780" width="220" height="40"/>
    <rect x="284" y="780" width="200" height="40"/>
    <rect x="520" y="836" width="240" height="48"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="18">
    <text x="80" y="46" font-size="26">SCORE</text><text x="954" y="46" font-size="24">Rounds: 3 | 3</text>
    <text x="64" y="80">Completed · Session only</text><text x="64" y="96">Not saved to local statistics or Elo</text>
    <text x="64" y="116">Match outcome: Bravo</text><text x="64" y="134">Last completed round: 3 — Bravo</text>
    <text x="80" y="160" font-size="16">Cumulative ranking</text>
    <text x="88" y="730">← Horizontal navigation →</text><text x="650" y="730">Rows: current / total · Position: current / total</text>
    <text x="86" y="806">Return to lobby</text><text x="326" y="806">End session</text><text x="552" y="868" font-size="26">End of Game</text>
  </g>
  <g fill="black" font-family="monospace" font-size="32">
    <text x="636" y="195" text-anchor="middle">---SCORE---</text>
  </g>
  <g fill="black" font-family="monospace" font-size="32" clip-path="url(#score-viewport)">
    <text x="96" y="228" textLength="640" lengthAdjust="spacingAndGlyphs">Player / identity / owner / team / state</text><text x="784" y="228">Rank</text><text x="896" y="228">K</text><text x="960" y="228">A</text><text x="1024" y="228">D</text><text x="1088" y="228">K/D</text><text x="1184" y="228">PTS</text>
    <text x="96" y="260">Alpha</text><text x="816" y="260">1</text>
    <text x="120" y="292">Player 1 / identity / owner</text><text x="120" y="324">Player 2 / identity / owner</text><text x="120" y="356">Player 3 / identity / owner</text><text x="120" y="388">Player 4 / identity / owner</text>
    <text x="96" y="428">Bravo</text><text x="816" y="428">2</text>
    <text x="120" y="460" textLength="576" lengthAdjust="spacingAndGlyphs">Player 5 / identity / owner / Departed</text><text x="120" y="492">Player 6 / identity / owner</text><text x="120" y="524">Player 7 / identity / owner</text><text x="120" y="556">Player 8 / identity / owner</text>
    <text x="96" y="596">Charlie</text><text x="816" y="596">3</text>
    <text x="120" y="628">Player 9 / identity / owner</text><text x="120" y="660">Player 10 / identity / owner</text><text x="120" y="692">Player 11 / identity / owner</text>
    <text x="864" y="292">| 1 | 2 | 3 | 0.33 | 4</text>
  </g>
  <g fill="black" font-family="sans-serif" font-size="17">
    <text x="20" y="930">ANNOTATIONS — not UI. Same final arena, curtain, panel and fixed notice as OVER-03; no menu banner or canvas.</text>
    <text x="20" y="956">Host: Return to lobby then End session. Guest: replace actions with Leave in the first position; no disabled host buttons.</text>
    <text x="20" y="982">Guest scope line also shows Waiting for host to return to lobby or end session. Persistence copy stays on line two.</text>
    <text x="20" y="1008">Overflow: bounded winner-count headings; complete outcome identity rows first in body, then cumulative/settings/rounds.</text>
    <text x="20" y="1034">32 px score rows; remaining teams/columns and per-round scores scroll into view. Supporting detail remains 16 px.</text>
    <text x="20" y="1060">Retained network player names stay neutral white: life state is unavailable. Reference fills/yellow values; no rank-based color.</text>
  </g>
</svg>
