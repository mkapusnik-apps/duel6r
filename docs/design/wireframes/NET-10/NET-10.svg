    <text x="67" y="473">Previous</text><text x="159" y="473">Page 1 / 2</text><text x="261" y="473">Next</text>
    <text x="333" y="473">Rows scroll; headings stay visible</text>
    <text x="61" y="528">Selected: session 2 • Predator • 192.168.1.24:26660</text>
    <text x="61" y="551">Password required. Round 1 in progress; play immediately if admitted.</text>
    <text x="61" y="574">The host confirms availability when you connect.</text>
    <text x="61" y="597">LAN-first. A listing does not guarantee reachability.</text>
    <text x="94" y="663">Join selected</text><text x="291" y="663">Refresh</text>
    <text x="460" y="663">Direct connect</text><text x="685" y="663">Back</text>
    <text x="25" y="753">Annotation: One layout for loading, results, empty, stale, and unavailable. No filters.</text>
    <text x="25" y="775">Stale: Join selected disabled; show Refresh before joining. Direct connect stays independent.</text>
    <text x="25" y="797">Selected details wrap or scroll. Row selection never bypasses NET-03 local-player setup.</text>
    <text x="25" y="819">Example endpoints are illustrative, not service configuration or reachability evidence.</text>
