<svg xmlns="http://www.w3.org/2000/svg" width="900" height="870" viewBox="0 0 900 870">
  <title>NET-10 — Mixed player-hosted and dedicated sessions</title>
  <desc>Existing 850 by 700 logical canvas. Six fixed table columns above scrolling rows. Separate selected details, current page, and unchanged two-row footer. Selected idle dedicated session has a nonzero identity, zero players, no controller or round. Join opens bound setup; it does not reserve authority. Busy, stale and unsupported selection reuse this allocation.</desc>
