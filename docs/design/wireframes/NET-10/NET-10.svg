    <text x="25" y="753">8 px outer-frame inset; ten visible rows. Conditional paging uses y=72 above the lowered footer.</text>
    <text x="25" y="775">Stale or refreshing: Access is Unconfirmed; names are hidden and Join selected is disabled.</text>
    <text x="25" y="797">The example shows the final five names. The count line has no focus or action.</text>
    <text x="25" y="819">Closed can accompany Started or Reserved. Status/paging stay reserved; unavailable page direction disabled.</text>
    <text x="25" y="841">No roster content or input after a failed or empty read. Direct connect and bound NET-03 setup are unchanged.</text>
