<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850">
  <title>NET-10 — All active sessions browser</title>
  <desc>NET-10-results. Canvas origin (25,20); SVG uses the top-left origin. The Browse panel, ten-row table, Refresh, paging, and footer retain their current bounds. The framed details retain 8 px inner padding and a 12 px gap below the table. Each labeled value is on its own line at left. The white read-only listbox at right has no heading; its count and overflow position are right-aligned below it. The example selects a protected 15/15 Full session in a single-page mixed result. Overflow focus is separate from session selection. The listbox has no player actions. The group is absent when no selection is inspectable.</desc>
