<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850">
  <title>NET-10 — All active sessions browser</title>
  <desc>NET-10-results. Fixed header, scrolling session rows with separate phase, protection and admission columns, bounded page navigation, selected-session detail, and fixed actions. Protected first-round selection remains joinable. NET-10-loading, NET-10-empty, NET-10-stale and NET-10-unavailable use the same body. Stale rows are inspection-only; joining requires a successful refresh.</desc>
  <rect width="900" height="850" fill="white"/>
  <g fill="none" stroke="black">
    <rect x="25" y="20" width="850" height="700"/>
    <rect x="350" y="40" width="200" height="95"/>
    <rect x="49" y="222" width="802" height="266"/>
    <path d="M49 252H851 M301 222V488 M373 222V488 M503 222V488 M623 222V488 M835 252V488"/>
    <rect x="51" y="282" width="782" height="30" stroke-width="2"/>
    <rect x="838" y="258" width="10" height="65"/>
    <rect x="57" y="455" width="90" height="25"/>
    <rect x="245" y="455" width="70" height="25"/>
    <rect x="49" y="504" width="802" height="109"/>
    <rect x="49" y="640" width="184" height="36"/>
    <rect x="249" y="640" width="140" height="36"/>
    <rect x="405" y="640" width="210" height="36"/>
    <rect x="631" y="640" width="140" height="36"/>
  </g>
