  <g font-family="sans-serif" font-size="14" fill="black">
    <text x="25" y="753">ANNOTATIONS: Examples show structure, not configured endpoints or required simultaneous fixtures.</text>
    <text x="25" y="778">Keep current font/spacing. Clip row endpoints; full selected metadata wraps or scrolls in details.</text>
    <text x="25" y="803">Unsupported Mac/Pi: readable dedicated row; flat disabled Join with platform reason. No dedicated Password entry.</text>
    <text x="25" y="828">Stale: Unconfirmed admission and Refresh reason. Busy/Full/Closed remain separate from capacity.</text>
    <text x="25" y="853">Selection/focus differ without color. No action bypasses eligibility. UX-NET-10-004/011–036.</text>
