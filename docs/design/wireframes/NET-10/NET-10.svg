    <text x="57" y="302">&gt; 192.168.1.24:26660</text><text x="309" y="302">4 / 15</text><text x="381" y="302">Round 1</text><text x="511" y="302">Required</text><text x="631" y="302">Open</text>
    <text x="57" y="333">192.168.1.28:26660</text><text x="309" y="333">15 / 15</text><text x="381" y="333">Lobby</text><text x="511" y="333">Required</text><text x="631" y="333">Full</text>
