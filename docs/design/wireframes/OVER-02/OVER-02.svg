  <g id="round-counter" font-family="sans-serif" font-size="32">
    <rect x="528" y="844" width="224" height="40" fill="black"/>
    <text x="640" y="876" text-anchor="middle" fill="white">Rounds: 3|5</text>
  </g>
  <g font-family="sans-serif" font-size="18" fill="black">
    <text x="20" y="932">ANNOTATIONS — not UI. Arena is under the animated dark-red winner curtain; outlined score surfaces retain production translucency.</text>
    <text x="20" y="960">Counter: client-centered measured backing; 8 px side / 4 px vertical padding; 40 px high; 16 px bottom inset.</text>
    <text x="20" y="988">No panel progress row. SCORE starts the panel; counter stays at least 16 px clear. Team rows and separator bands are unchanged.</text>
    <text x="20" y="1016">The 3|5 count includes two rounds before resume. Top arena progress stays hidden until the next round; no Continue prompt.</text>
    <text x="20" y="1044">Unlimited summaries reserve no counter/footer. Active Tab and final summaries retain their separate owning contracts.</text>
  </g>
