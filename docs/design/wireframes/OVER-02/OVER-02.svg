<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
  <title id="title">OVER-02 — Non-final Team round summary, round 3 of 5</title>
  <desc id="desc">1280 by 900 client. A non-final four-team result follows round three of a resumed five-round match. The score panel has no progress row; SCORE is its first content row. The existing Rounds: 3|5 counter sits outside the panel at the complete client's bottom center, on measured black backing with eight-pixel side padding, four-pixel vertical padding and a sixteen-pixel bottom inset. The shortened panel remains centered when footer clearance permits. Arena progress is hidden. Team groups retain eight-pixel separator bands with centered two-pixel rules. A dark-red curtain is represented by annotation, not a new monochrome production treatment.</desc>
