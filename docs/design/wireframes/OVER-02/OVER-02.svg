  <g fill="none" stroke="black" stroke-width="2">
    <rect x="1" y="1" width="1278" height="898"/>
    <path d="M40 380H230V410H40 M1050 610H1240V640H1050 M40 820H1240"/>
    <path d="M40 790Q120 775 200 790T360 790T520 790T680 790T840 790T1000 790T1160 790H1240" stroke-dasharray="8 4"/>
  </g>
  <text x="20" y="32" font-family="sans-serif" font-size="18">Ada: Team Alpha won!</text>
