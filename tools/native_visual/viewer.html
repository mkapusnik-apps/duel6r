<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Original-frame / PTS inspection</title>
<style>
body{font:16px system-ui;background:#eee;color:#111;margin:16px}button,select{font:inherit;margin:4px;padding:6px}
:focus-visible{outline:3px solid #0645ad;outline-offset:3px}#panel{background:#222;overflow:auto;max-height:75vh;width:100%}
#frame{display:block;max-width:none}#panel.fit #frame{max-width:100%;max-height:75vh;width:auto;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}
#status{font-weight:bold}#error{color:#900}fieldset{margin:8px 0}#position{font-variant-numeric:tabular-nums}
</style>
<h1>Original-frame / PTS inspection</h1>
<pre id="identity">Loading provenance…</pre>
<fieldset><legend>Frame navigation (controls are outside the image)</legend>
<button id="previous" disabled>Previous</button><button id="next" disabled>Next</button>
<button id="play" disabled>Play</button><button id="pause" disabled>Pause</button>
<label>Display <select id="scale"><option value="native">Native pixels (scroll)</option><option value="fit">Fit complete frame</option></select></label>
<div id="position"></div><div id="status" role="status" aria-live="polite">Loading</div>
<div id="error" role="alert"></div></fieldset>
<div id="panel" tabindex="0" aria-label="Complete decoded source frame; arrow keys step, Space plays or pauses">
<img id="frame" alt="Full decoded source frame, not a canonical screenshot"></div>
<pre id="derivative"></pre>
<script>
"use strict";
const $ = id => document.getElementById(id);
let data, ordinal = 0, playing = false, timer, generation = 0, busy = false, scheduleStall = 0;
function status(text) { $("status").textContent = text; }
function fail(error) {
  playing = false; clearTimeout(timer); $("error").textContent = String(error);
  status("Stopped: decode / missing-frame / gap error"); controls();
}
function controls() {
  $("previous").disabled = !data || busy || playing || ordinal === 0;
  $("next").disabled = !data || busy || playing || ordinal === data.frames.length - 1;
  $("play").disabled = !data || busy || playing || ordinal === data.frames.length - 1 || !!$("error").textContent;
  $("pause").disabled = !playing;
}
function scale() {
  $("panel").classList.toggle("fit", $("scale").value === "fit");
  if (!data) return;
  const ratio = $("frame").getBoundingClientRect().width / data.validation.width;
  $("derivative").textContent = "DERIVATIVE full-frame decode; display scale " + ratio.toFixed(6)
    + ". No interpolation between source ordinals. PNG SHA-256: " + data.frames[ordinal].sha256;
}
async function show(target) {
  if (!data || target < 0 || target >= data.frames.length) return false; // no wrap
  const version = ++generation; busy = true; controls();
  const item = data.frames[target];
  status("Loading source ordinal " + target + (playing ? " — playback stalled until decoded" : ""));
  const started = performance.now();
  try {
    const response = await fetch(item.path, {cache:"no-store"});
    if (!response.ok) throw Error("Missing frame " + target + ": HTTP " + response.status);
    const bytes = await response.arrayBuffer();
    const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", bytes))].map(b=>b.toString(16).padStart(2,"0")).join("");
    if (hash !== item.sha256) throw Error("Frame hash mismatch at ordinal " + target);
    const image = new Image(), url = URL.createObjectURL(new Blob([bytes], {type:"image/png"}));
    try {
      image.src = url; await image.decode();
      if (image.naturalWidth !== data.validation.width || image.naturalHeight !== data.validation.height)
        throw Error("Decoded dimensions disagree at ordinal " + target);
      if (version !== generation) { URL.revokeObjectURL(url); return false; }
      const old = $("frame").src; $("frame").src = url;
      if (old.startsWith("blob:")) URL.revokeObjectURL(old);
      ordinal = target;
      $("position").textContent = "Source ordinal " + ordinal + " / " + (data.frames.length-1)
        + " (zero-based); exact PTS " + item.pts + " ticks × time base " + data.validation.time_base;
      status((playing ? "Playing without skips" : "Paused") + "; last load stall " + (performance.now()-started).toFixed(1)
        + " ms; scheduler stall " + scheduleStall.toFixed(1) + " ms");
      requestAnimationFrame(scale);
      return true;
    } catch(error) { URL.revokeObjectURL(url); throw error; }
  } catch(error) { fail(error); return false; }
  finally { busy = false; controls(); }
}
function pause() { playing = false; ++generation; clearTimeout(timer); status("Paused"); controls(); }
async function advance() {
  if (!playing) return;
  if (ordinal === data.frames.length-1) { pause(); status("End of original — no wrap"); return; }
  const [num, den] = data.validation.time_base.split("/").map(Number);
  const delay = (data.frames[ordinal+1].pts - data.frames[ordinal].pts) * num / den * 1000;
  const due = performance.now() + delay;
  timer = setTimeout(async () => {
    if (!playing) return;
    scheduleStall = Math.max(0, performance.now() - due);
    if (await show(ordinal+1)) advance(); // wait for each exact frame; never catch up by skipping
  }, delay);
}
function play() { if (!$("play").disabled) { playing = true; controls(); status("Playing without skips"); advance(); } }
$("previous").onclick = () => show(ordinal-1);
$("next").onclick = () => show(ordinal+1);
$("play").onclick = play; $("pause").onclick = pause;
$("scale").onchange = scale; window.addEventListener("resize", scale);
$("panel").onkeydown = event => {
  if (["ArrowLeft","ArrowRight"," "].includes(event.key)) event.preventDefault();
  if (event.key === " ") { if (playing) pause(); else play(); }
  if (!playing && !busy && event.key === "ArrowLeft") show(ordinal-1);
  if (!playing && !busy && event.key === "ArrowRight") show(ordinal+1);
};
function validateIndex(value) {
  if (value.receipt_version !== 1 || !value.original || !value.frames?.length) throw Error("Unsupported/missing provenance index");
  if (!/^[a-f0-9]{64}$/.test(value.original.sha256) || !/^[a-f0-9]{40}$/.test(value.original.candidate)
    || value.validation.frame_count !== value.frames.length
    || !(value.validation.width>0 && value.validation.height>0)
    || !Number.isFinite(value.validation.max_gap_seconds) || value.validation.max_gap_seconds<=0)
    throw Error("Invalid original identity/dimensions/coverage contract");
  const [num,den] = value.validation.time_base.split("/").map(Number);
  if (!(num>0 && den>0)) throw Error("Invalid source time base");
  value.frames.forEach((item,i) => {
    if (item.ordinal !== i || !Number.isSafeInteger(item.pts) || !/^[a-f0-9]{64}$/.test(item.sha256)
      || item.path !== "frames/" + String(i).padStart(6,"0") + ".png") throw Error("Missing/invalid ordinal mapping " + i);
    if (i && (item.pts<=value.frames[i-1].pts || (item.pts-value.frames[i-1].pts)*num/den > Number(value.validation.max_gap_seconds)))
      throw Error("Nonmonotonic/gapped source PTS at " + i);
  });
}
(async () => {
  try {
    const response = await fetch("index.json", {cache:"no-store"});
    if (!response.ok) throw Error("Index HTTP " + response.status);
    const parsed = await response.json(); validateIndex(parsed); data = parsed;
    const original = data.original;
    $("identity").textContent = "Original: " + original.path + "\nSHA-256: " + original.sha256
      + "\nCandidate: " + original.candidate + "\nProvenance: " + original.provenance
      + "\nSource dimensions: " + data.validation.width + " × " + data.validation.height
      + "\nTool: " + data.tool + " — receipt version " + data.receipt_version;
    await show(0);
  } catch(error) { fail(error); }
})();
</script>
